{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="brand">
                <div class="brand-icon">🎓</div>
                <div class="brand-text">
                    <h1>EduCore AI</h1>
                    <p>Intelligent Learning Platform</p>
                </div>
            </div>
            <div class="user-info">
                <a href="{% url 'frontend:dashboard' %}" class="btn-secondary">← Back to Dashboard</a>
            </div>
        </div>
    </header>

    <main style="padding: 4rem 2rem; text-align: center;">
        <div style="max-width: 600px; margin: 0 auto;">
            <div style="font-size: 5rem; margin-bottom: 2rem;">🤖</div>
            <h1 style="color: var(--text); margin-bottom: 1rem;">AI Dashboard Coming Soon!</h1>
            <p style="color: var(--muted); font-size: 1.2rem; margin-bottom: 2rem;">
                We're building an amazing AI-powered analytics dashboard for personalized learning insights.
            </p>
            <a href="{% url 'frontend:dashboard' %}" class="btn-primary" style="padding: 1rem 2rem;">
                Return to Dashboard
            </a>
        </div>
    </main>
</body>
</html>
