<!DOCTYPE html>
<html lang="en">
<head>

    <title>AI-Powered Learning Platform</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <section id="hero" class="gradient-bg">
        <div class="container">
            <span class="badge">🤖 AI-Powered Learning • 100% Free</span>
            <h1>Master Operating Systems with <span class="highlight">AI Guidance</span></h1>

            <div class="cta-buttons">
              <button id="startLearningBtn" class="btn-primary">Start Learning Now</button>
              <button id="demoBtn" class="btn-secondary">Watch Demo</button>
            </div>
      
            <div class="stats-grid">
              <div class="stat-item">
                <div class="stat-value">50+</div>
                <div class="stat-label">Interactive Tutorials</div>
              </div>
              <div class="stat-item">
                <div class="stat-value">100+</div>
                <div class="stat-label">Practice Quizzes</div>
              </div>
              <div class="stat-item">
                <div class="stat-value">24/7</div>
                <div class="stat-label">AI Assistant</div>
              </div>
              <div class="stat-item">
                <div class="stat-value">Free</div>
                <div class="stat-label">Forever</div>
              </div>
            </div>
          </div>
    </section>

    
    

</body>
</html>
