{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Quiz - Learning Game</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <style>
        .game-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        
        .game-header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            text-align: center;
        }
        
        .game-header h2 {
            margin: 0 0 16px 0;
        }
        
        .game-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            font-size: 18px;
        }
        
        .back-btn {
            margin-top: 16px;
            padding: 8px 24px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        
        .quiz-question {
            background: var(--card);
            border: 1px solid var(--ring);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
        }
        
        .quiz-options {
            display: grid;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .quiz-option {
            background: var(--card);
            border: 2px solid var(--ring);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .quiz-option:hover {
            border-color: var(--accent);
            transform: translateX(4px);
        }
        
        .quiz-option.correct {
            border-color: #10b981;
            background: rgba(16,185,129,0.1);
        }
        
        .quiz-option.wrong {
            border-color: #ef4444;
            background: rgba(239,68,68,0.1);
        }
        
        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card);
            padding: 48px;
            border-radius: 24px;
            border: 2px solid var(--ring);
            text-align: center;
            z-index: 1000;
            min-width: 400px;
        }
        
        .game-over.show {
            display: block;
        }
        
        .game-over h2 {
            margin: 0 0 16px 0;
            font-size: 36px;
        }
        
        .control-btn {
            padding: 12px 32px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h2>❓ Quick Quiz</h2>
            <div class="game-stats">
                <span>Score: <span id="quizScore">0</span></span>
                <span>Question: <span id="quizCurrent">1</span>/10</span>
            </div>
            <a href="{% url 'learning:games_list' %}" class="back-btn">Exit</a>
        </div>
        
        <div class="quiz-question" id="quizQuestion">Loading...</div>
        <div class="quiz-options" id="quizOptions"></div>
        
        <div class="game-over" id="quizGameOver">
            <h2>Quiz Complete!</h2>
            <p style="font-size: 1.5rem; margin: 1rem 0;">Final Score: <span id="quizFinalScore">0</span>/10</p>
            <button class="control-btn" onclick="quizGame.reset()">Play Again</button>
            <br><br>
            <a href="{% url 'learning:games_list' %}" class="btn-secondary">Back to Games</a>
        </div>
    </div>

    <script>
        const quizGame = {
            questions: [
                {q: "What does OS stand for?", a: ["Operating System", "Open Source", "Output Stream", "Object Storage"], c: 0},
                {q: "Which SQL command deletes data?", a: ["REMOVE", "DELETE", "DROP", "ERASE"], c: 1},
                {q: "What is a deadlock?", a: ["System crash", "Process waiting loop", "Memory leak", "Disk error"], c: 1},
                {q: "What is normalization?", a: ["Data backup", "Database design", "Query optimization", "Index creation"], c: 1},
                {q: "What is a mutex?", a: ["Memory unit", "Mutual exclusion lock", "Multiple execution", "Module utility"], c: 1},
                {q: "ACID stands for?", a: ["Access Control ID", "Atomicity Consistency Isolation Durability", "Auto Commit Index Database", "Active Cache Indexed Data"], c: 1},
                {q: "What is virtual memory?", a: ["RAM simulation", "Disk as RAM", "Cache memory", "Network storage"], c: 1},
                {q: "Primary key must be?", a: ["Numeric", "Unique", "Indexed", "Foreign"], c: 1},
                {q: "What is a semaphore?", a: ["Signal variable", "Memory address", "Thread pool", "Cache line"], c: 0},
                {q: "What is SQL injection?", a: ["Query syntax", "Security vulnerability", "Data type", "Index method"], c: 1}
            ],
            currentQuestion: 0,
            score: 0,

            init() {
                this.reset();
            },

            reset() {
                this.currentQuestion = 0;
                this.score = 0;
                this.questions.sort(() => Math.random() - 0.5);
                document.getElementById('quizGameOver').classList.remove('show');
                this.showQuestion();
            },

            showQuestion() {
                if (this.currentQuestion >= this.questions.length) {
                    this.endQuiz();
                    return;
                }

                const q = this.questions[this.currentQuestion];
                document.getElementById('quizQuestion').textContent = q.q;
                document.getElementById('quizCurrent').textContent = this.currentQuestion + 1;
                document.getElementById('quizScore').textContent = this.score;

                const optionsDiv = document.getElementById('quizOptions');
                optionsDiv.innerHTML = '';
                q.a.forEach((answer, index) => {
                    const option = document.createElement('div');
                    option.className = 'quiz-option';
                    option.textContent = answer;
                    option.onclick = () => this.checkAnswer(index);
                    optionsDiv.appendChild(option);
                });
            },

            checkAnswer(selected) {
                const q = this.questions[this.currentQuestion];
                const options = document.querySelectorAll('.quiz-option');
                
                options[selected].classList.add(selected === q.c ? 'correct' : 'wrong');
                options[q.c].classList.add('correct');
                
                if (selected === q.c) this.score++;

                options.forEach(opt => opt.onclick = null);
                
                setTimeout(() => {
                    this.currentQuestion++;
                    this.showQuestion();
                }, 1000);
            },

            endQuiz() {
                document.getElementById('quizFinalScore').textContent = this.score;
                document.getElementById('quizGameOver').classList.add('show');
            }
        };

        quizGame.init();
    </script>
</body>
</html>
