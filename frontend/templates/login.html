{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ title|default:"Login – EduCore AI" }}</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="centered">
  <form method="post" class="auth-card">
    {% csrf_token %}
    <h2>Sign in</h2>

    {% if messages %}
      <div class="messages">
        {% for m in messages %}
          <p class="message {{ m.tags }}">{{ m }}</p>
        {% endfor %}
      </div>
    {% endif %}

    {{ form.non_field_errors }}

    <label for="{{ form.username.id_for_label }}">Email / Username</label>
    {{ form.username }}

    <label for="{{ form.password.id_for_label }}">Password</label>
    {{ form.password }}

    <button type="submit" class="btn-primary" style="margin-top:12px">Login</button>
  </form>
</body>
</html>
